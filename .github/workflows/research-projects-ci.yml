name: Quant research project evidence

on:
  push:
    paths:
      - "01_universal_foundations/02_cross_asset_statistical_arbitrage/**"
      - "01_universal_foundations/03_kalman_filter_hmm_regimes/**"
      - "02_quant_research/01_factor_modeling_pca_eigenportfolios/**"
      - "02_quant_research/02_cointegration_stat_arb_kalman_spreads/**"
      - "03_quant_trading/02_avellaneda_stoikov_market_making/**"
      - "03_quant_trading/05_hawkes_process_market_making/**"
      - ".github/workflows/research-projects-ci.yml"
  pull_request:
    paths:
      - "01_universal_foundations/02_cross_asset_statistical_arbitrage/**"
      - "01_universal_foundations/03_kalman_filter_hmm_regimes/**"
      - "02_quant_research/01_factor_modeling_pca_eigenportfolios/**"
      - "02_quant_research/02_cointegration_stat_arb_kalman_spreads/**"
      - "03_quant_trading/02_avellaneda_stoikov_market_making/**"
      - "03_quant_trading/05_hawkes_process_market_making/**"
      - ".github/workflows/research-projects-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01_universal_foundations/02_cross_asset_statistical_arbitrage
          - 01_universal_foundations/03_kalman_filter_hmm_regimes
          - 02_quant_research/01_factor_modeling_pca_eigenportfolios
          - 02_quant_research/02_cointegration_stat_arb_kalman_spreads
          - 03_quant_trading/02_avellaneda_stoikov_market_making
          - 03_quant_trading/05_hawkes_process_market_making
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  heston-cpp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_quant_developer/01_cpp_derivatives_pricing_engine
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build --output-on-failure
